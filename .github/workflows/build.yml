# What has to hold before a change is believed.
#
# Windows is in the matrix rather than an afterthought: nearly every bug this CLI has had was
# one — a batch file with the wrong line endings, PowerShell prefixing piped input with a byte
# order mark, PATH being rebuilt instead of appended to, a console that reports itself a
# terminal when it is a pipe. None of those fail on Linux.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing is learned from finishing a run of stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform should not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Test
        run: ./mvnw --batch-mode test

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/

  native:
    name: native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GraalVM rather than a plain JDK: the point of this job is that the native profile
      # still builds, which a change to reachability metadata can break while every test passes.
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the binary
        run: ./mvnw --batch-mode -Pnative package -DskipTests

      # The binary answering at all proves more than the build exiting zero: a missing
      # reflect-config leaves an image that builds and then refuses its own options.
      - name: Check it runs
        run: |
          ./target/orkx --version
          ./target/orkx help > /dev/null
          ./target/orkx completion bash > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: orkx-linux-x64
          path: target/orkx
