# What has to hold before a change is believed.
#
# Windows is in the matrix rather than an afterthought: nearly every bug this CLI has had was
# one — a batch file with the wrong line endings, PowerShell prefixing piped input with a byte
# order mark, PATH being rebuilt instead of appended to, a console that reports itself a
# terminal when it is a pipe. None of those fail on Linux.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing is learned from finishing a run of stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Beyond reading the code, the only thing this needs is to write the test count to the
    # badges branch. Nothing else in the repository is writable from here.
    permissions:
      contents: write
    strategy:
      # One failing platform should not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Test
        run: ./mvnw --batch-mode test

      # The number on the README badge is counted from the surefire reports rather than typed
      # into the README, where it would be wrong the first time somebody adds a test and
      # forgets. Linux only: both platforms run the same suite, and a badge two jobs race to
      # write reads as whichever finished last.
      - name: Count what passed
        id: count
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          import xml.etree.ElementTree as ElementTree

          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in glob.glob("target/surefire-reports/TEST-*.xml"):
              suite = ElementTree.parse(report).getroot()
              for name in totals:
                  totals[name] += int(suite.get(name, 0))

          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          print("passed=%d" % passed)
          PY

      # An orphan branch, force pushed: the badge only ever wants the current number, so the
      # branch stays a single commit and never grows. It is not on main, so writing it cannot
      # set this workflow off again.
      - name: Publish the count for the badge
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          PASSED: ${{ steps.count.outputs.passed }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          work=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"tests","message":"%s passing","color":"brightgreen"}\n' \
            "$PASSED" > "$work/tests.json"
          cd "$work"
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests.json
          git commit -q -m "tests: $PASSED passing"
          git push -q --force "https://x-access-token:$TOKEN@github.com/$REPOSITORY.git" badges

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/

  native:
    name: native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GraalVM rather than a plain JDK: the point of this job is that the native profile
      # still builds, which a change to reachability metadata can break while every test passes.
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the binary
        run: ./mvnw --batch-mode -Pnative package -DskipTests

      # The binary answering at all proves more than the build exiting zero: a missing
      # reflect-config leaves an image that builds and then refuses its own options.
      - name: Check it runs
        run: |
          ./target/orkx --version
          ./target/orkx help > /dev/null
          ./target/orkx completion bash > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: orkx-linux-x64
          path: target/orkx
